<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/index.css">
    <title>Task-manager</title>
</head>
<body>
    <section id="tasks_container">
    </section>
    
    <div class="button-area">
        <button class="button" id="adder">
            <img src="img/icons8-edit.svg" alt="edit" id="adder__icon">
        </button>
    </div>

    <div id="taskModal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2>Новая задача</h2>
            <form id="taskForm">
                <div class="form-group">
                    <label for="taskName">Название:</label>
                    <input type="text" id="taskName" autocomplete="off" required>
                </div>
                <div class="form-group">
                    <label for="taskDesc">Описание:</label>
                    <textarea id="taskDesc" rows="4"></textarea>
                </div>
                <button type="submit" class="submit-btn">Добавить</button>
            </form>
        </div>
    </div>

    <div class="modal" id="editModal">
        <div class="edit-content">
            <span class="close-modal">&times;</span>
            <h2>Редактировать</h2>
            <form id="editForm">
                <div class="form-group">
                    <label for="taskName">Название:</label>
                    <input type="text" id="taskName" autocomplete="off" required>
                </div>
                <div class="form-group">
                    <label for="taskDesc">Описание:</label>
                    <textarea id="taskDesc" rows="4"></textarea>
                </div>
                <button type="submit" class="submit-btn">Добавить</button>
                </div>
            </form>
        </div>
    </div>
    
    <div class="modal" id="editModal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2>Редактировать</h2>
            <form id="editForm">
                <div class="form-group">
                    <label for="editTaskName">Название:</label>
                    <input type="text" id="editTaskName" autocomplete="off" required>
                </div>
                <div class="form-group">
                    <label for="editTaskDesc">Описание:</label>
                    <textarea id="editTaskDesc" rows="4"></textarea>
                </div>
                <button type="submit" class="submit-btn">Изменить</button>
            </form>
        </div>
    </div>
    
    <script src="script/index.js"></script>
</body>
</html>
